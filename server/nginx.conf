# Optional extras for an nginx server you already run (both are optional).

# 1. Heartbeat endpoint - set the device's heartbeat to {"url": "http://your.server/hb", "method": "GET"}.
#    Put this line at the top level of the site file (http context):
log_format raindash_hb '$time_iso8601 $remote_addr $args';

server {
    # ... your existing server settings ...

    location = /hb { access_log /var/log/nginx/raindash-hb.log raindash_hb; return 204; }

    # 2. Status page written by status.py (cron: raindash-status.cron), Tailscale addresses only.
    location = /status { return 301 /status/; }
    location /status/ {
        alias /var/www/raindash-status/;
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        add_header Cache-Control "no-cache";
    }
}
